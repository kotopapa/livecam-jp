name: monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 死活監視
        run: python -m monitor.main
      - name: スキーマ検証
        run: python -m crawler.validate
      - name: status.json と履歴をコミット
        run: |
          git config user.name "livecam-jp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json monitor/.state/hashes.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "monitor: status update"
            git pull --rebase origin main
            git push
          fi
