name: monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 死活監視（30分ごとに1シャード巡回。全カメラは5時間で一巡）
        run: |
          SHARD=$(( ($(date +%s) / 1800) % 10 ))
          echo "shard=${SHARD}/10"
          python -m monitor.main --shard ${SHARD}/10
      - name: スキーマ検証
        run: python -m crawler.validate
      - name: status.json と履歴をコミット
        run: |
          git config user.name "livecam-jp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json monitor/.state/hashes.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "monitor: status update"
            # status.json/hashes.jsonは実行のたびに全量再生成されるため、
            # 他コミットと競合したら自分側(このrunの最新状態)を採用してよい
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
          fi
