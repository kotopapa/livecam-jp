name: push-test

# Push通知の手動テスト送信（本番トピックに任意の文面を送る）。
# 使い方: gh workflow run push-test.yml -f topics=special-warning,special-warning-14
on:
  workflow_dispatch:
    inputs:
      topics:
        description: "送信先トピック(カンマ区切り。token指定時は無視可)"
        required: false
        default: "special-warning,special-warning-14"
      token:
        description: "デバイストークン宛に直接送信(任意)"
        required: false
        default: ""
      mode:
        description: "send=送信 / inspect=トークンの購読状況照会 / subscribe=サーバー側から購読登録"
        required: false
        default: "send"
      title:
        description: "通知タイトル"
        required: true
        default: "【テスト】通知のテスト配信です"
      body:
        description: "通知本文"
        required: true
        default: "全国ライブカメラ地図のPush通知テストです。実際の警報ではありません"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: テスト送信
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOPICS: ${{ inputs.topics }}
          DEVICE_TOKEN: ${{ inputs.token }}
          MODE: ${{ inputs.mode }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          python - <<'EOF'
          import json, os, requests
          from tools.bosai_notify import fcm_token, send_push
          sa = os.environ["FIREBASE_SERVICE_ACCOUNT"]
          token, project = fcm_token(json.loads(sa))
          device = os.environ.get("DEVICE_TOKEN", "").strip()
          mode = os.environ.get("MODE", "send").strip()
          if mode == "inspect" and device:
              r = requests.get(
                  f"https://iid.googleapis.com/iid/info/{device}?details=true",
                  headers={"Authorization": f"Bearer {token}",
                           "access_token_auth": "true"}, timeout=30)
              print("inspect:", r.status_code)
              print(json.dumps(r.json(), ensure_ascii=False, indent=1)[:1500])
              raise SystemExit(0)
          if mode == "subscribe" and device:
              for tp in os.environ.get("TOPICS", "").split(","):
                  tp = tp.strip()
                  if not tp: continue
                  r = requests.post(
                      "https://iid.googleapis.com/iid/v1:batchAdd",
                      headers={"Authorization": f"Bearer {token}",
                               "access_token_auth": "true"},
                      json={"to": f"/topics/{tp}",
                            "registration_tokens": [device]}, timeout=30)
                  print("subscribe", tp, r.status_code, r.text[:200])
              raise SystemExit(0)
          if device:
              r = requests.post(
                  f"https://fcm.googleapis.com/v1/projects/{project}/messages:send",
                  headers={"Authorization": f"Bearer {token}"},
                  json={"message": {
                      "token": device,
                      "notification": {"title": os.environ["TITLE"],
                                       "body": os.environ["BODY"]},
                      "apns": {"headers": {"apns-priority": "10"},
                               "payload": {"aps": {"sound": "default"}}},
                  }}, timeout=30)
              print("direct:", r.status_code, r.text[:300])
              r.raise_for_status()
          for topic in os.environ.get("TOPICS", "").split(","):
              topic = topic.strip()
              if topic:
                  send_push(token, project, topic,
                            os.environ["TITLE"], os.environ["BODY"])
          EOF
