        <h1 class="title">HBC情報カメラ・いまの札幌</h1>
      </header>
      <div class="text">

          <p>札幌・大通公園に隣接する大通ビッセ屋上にあるカメラからは、季節によって表情を大きく変える大通公園や、藻岩山（▲531m）や円山（▲225m）などの山並み、そして大倉山ジャンプ競技場もご覧いただけます。撮影可能範囲には「北海道庁赤レンガ庁舎」、「テレビ塔」、そして繁華街「ススキノ」もあり、放送業務でカメラの撮影方向を変更する際などに、ご覧いただけることがあります。</p>
