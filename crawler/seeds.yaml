  - note: 北海道開発局・北陸・中部・四国・沖縄総合事務局、47都道府県、火山カメラ（気象庁・砂防）

# クロール対象外（SPEC 6.2 除外リスト）

excluded:
  - 民間ライブカメラまとめサイト全般（cametan.com 等。著作権・規約上NG）
  - 個人・企業設置カメラ
  - ログインが必要なもの
