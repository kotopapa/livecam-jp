# クロール起点。source は crawler/sources/__init__.py の REGISTRY キーに対応する。
# enabled: false のものは実装待ち（パーサ追加時に有効化）。

sources:
  - id: mlit_ktr_river
    enabled: true
    note: 関東地方整備局。リンク集→事務所→河川別ページから scamId を収集し kawabou で解決

  - id: mlit_qsr_youtube
    enabled: true
    note: 九州地方整備局の官公庁YouTube配信（優先度最高）。座標なし→手動レビューで確定

  - id: mlit_ktr_road
    enabled: true
    note: 関東地整の道路カメラ（静止画URL共通の4事務所：宇都宮・高崎・相武・北首都）。
          座標なし→ジオコーディング+手動レビュー。大宮・横浜・甲府・長野はURL規則が
          別系統のため未対応（mlit_ktr_road.py の docstring 参照）

  - id: mlit_cbr_road
    enabled: true
    note: 中部地整・名古屋国道の道路カメラ（めいこくWEB）。CMS断片が実質API。
          座標はGoogle My Maps KMLから照合（取れない場合はジオコーディング）。
          中部の他事務所（静岡・岐阜国道等）は未対応

  - id: mlit_hrr_road
    enabled: true
    note: 北陸地整・金沢河川国道「みちナビ石川」。map.data.js に座標直書き。
          国交省管轄(A)のみ採用。石川県(B)・金沢市(D)は自治体枠で将来対応

  - id: mlit_roadinfo
    enabled: true
    note: 道路情報提供システム（road-info-prvs）。全国の直轄道路カメラ集約（道路版kawabou）。
          対象CD 81,82,86,87,88,89,90。83-85は事務所サイト直の既存パーサ優先（重複回避）。
          固定URLがない都度解決型feed。license=unknownで規約確認後に一括承認する

  - id: tokyo_suibo
    enabled: true
    note: 東京都水防チャンネル(都建設局)。オープンデータCSV(CC BY)に観測所名・河川名・
          YouTube動画URL・正確な座標。110台。動画ID変化は週次クロール+承認済みfeed更新で追従

  - id: youtube_gov_live
    enabled: true
    note: 官公庁YouTubeチャンネルの配信中ライブ収集(streams解析)。現在は四国地整CCTV(9本)。
          近畿14ch・北陸5本・北海道2本は第2弾でCHANNELSに追加する

  - id: curated_youtube
    enabled: true
    note: 民間・報道系YouTubeライブのキュレーション台帳(crawler/curated_youtube.yaml)。
          運営者確認済みのみ人手追加。渋谷スクランブル(ANN/FNN)・新宿・銀座・道頓堀・
          雷門・秋葉原・桜島MBC・羽田/成田・みなとみらい等17本

  - id: muni_youtube
    enabled: true
    note: 市町村公式YouTubeライブ(大田原8・春日井4・志木3・横須賀28)。静的ページの
          リンク列挙をパース。動画IDは週次クロールで追従

  - id: mbc_webcam
    enabled: true
    note: MBC南日本放送「かごしまライブカメラ」85地点(静止画網)。インラインJSONを解析。
          設置者混在(気象庁・国道事務所・役場等)のためlicense=unknown

  - id: curated_world
    enabled: true
    note: 世界の有名スポットYouTubeライブ(人手キュレーション台帳 curated_world.yaml)。
          prefecture=99(海外)+country。license=unknown

  - id: toyama_road
    enabled: true
    note: 富山県「とやま道路情報」約174台。静的JSON(camera_master.json)に座標つき。
          規約明示なし→license=unknownで人手レビュー

  - id: hiroshima_road
    enabled: true
    note: 広島県「ひろしま道路ナビ」150台前後。snow_pic/<ID>.jpg固定URL。
          座標なし→住所ジオコーディング。license=unknown

  - id: fukushima_road
    enabled: true
    note: 福島県会津地区の峠カメラ(約9台)。absv2.f-road.infoのhttps静止画。
          地名ジオコーディング。license=unknown

  - id: ishikawa_road
    enabled: true
    note: 石川県「石川みち情報ネット」約190台。api/getCameraMaster(座標つき)+
          img/camera/<id>.jpg固定URL。license=unknown

  - id: gifu_road
    enabled: true
    note: 岐阜県「道の情報」約350地点。api/getCameraMaster+getCamera(画像対応表)。
          license=unknown

  - id: fukui_road
    enabled: true
    note: 福井県「みち情報ネットふくい」約215台(NEXCO・国交省・滋賀県分は除外)。
          cameras.json(座標つき)+assets/images/camera/<id>.jpg。license=unknown

  - id: shimane_road
    enabled: true
    note: 島根県「道路カメラ情報」約120台。point.json5(座標つき)+snapshot固定URL。
          license=unknown

  - id: muni_road
    enabled: true
    note: 市町村道路カメラ統合(妙高XML座標つき・郡上市所有分・南小国12・新見2・高森2)。
          license=unknown

  - id: miyagi_road
    enabled: true
    note: 宮城県道路管理ライブカメラ(北部・大河原西/東部)。HTTP専用のためiOSはATS例外。
          座標は地点名ジオコーディング。license=unknown

  - id: hbc_webcam
    enabled: true
    note: HBC北海道放送「情報カメラ」34地点(静止画網)。地点ページのGoogleマップ埋込から
          座標を機械取得。license=unknown

  - id: kaiho_webcam
    enabled: true
    note: 海上保安庁「海の安全情報」の灯台・海上交通センターカメラ12地点(静止画)。
          座標は手動対応表。license=unknown

  - id: kawabou_pref
    enabled: false
    note: 川の防災情報の県単位一括収集（全国展開・M5用）。リクエスト数が多いので明示的に有効化する
    # kawabou の prefCd（crawler/tests/fixtures/kawabou_prefarea.json 参照）
    # 例: 関東 = [801, 901, 1001, 1101, 1201, 1301, 1401]
    pref_codes: []

# 実装待ちシード（SPEC 6.2 より。パーサ追加時に sources へ昇格させる）
  - id: jma_volcam
    enabled: true
    note: 気象庁 火山監視カメラ95台(camicon.geojsonが座標つき台帳)。都度解決型
          feed=jma_volcam。政府標準利用規約(出典明記)
